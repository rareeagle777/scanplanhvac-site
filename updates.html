<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanPlan HVAC - Updates</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        h1 {
            color: #007AFF;
            margin-bottom: 40px;
        }
        .release {
            border-left: 4px solid #007AFF;
            padding: 20px;
            margin-bottom: 30px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .release-date {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        .commit-message {
            font-weight: 600;
            margin-bottom: 8px;
        }
        .commit-body {
            color: #555;
            font-size: 0.95em;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .commit-files {
            margin-top: 8px;
            font-size: 0.85em;
        }
        .files-label {
            color: #888;
            margin-right: 6px;
        }
        .file-chip {
            display: inline-block;
            background: #e8f0fe;
            color: #1a56db;
            border-radius: 4px;
            padding: 2px 7px;
            margin: 2px 3px 2px 0;
            font-family: monospace;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>📱 ScanPlan HVAC Updates</h1>
    <div id="updates" class="loading">Loading updates...</div>

<script>
    function escapeHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function cleanBody(raw) {
        return raw
            .replace(/^Co-Authored-By:.*$/gim, '')
            .trim();
    }

    fetch('commits.json')
        .then(response => {
            if (!response.ok) throw new Error('Failed to load commits');
            return response.json();
        })
        .then(commits => {
            const updatesDiv = document.getElementById('updates');

            const html = commits.map(commit => {
                const date = new Date(commit.date).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                const body = commit.body ? cleanBody(commit.body) : '';
                const bodyHtml = body
                    ? `<div class="commit-body">${escapeHtml(body).replace(/\n/g, '<br>')}</div>`
                    : '';

                const filesHtml = commit.files && commit.files.length
                    ? `<div class="commit-files">
                         <span class="files-label">Changed files:</span>
                         ${commit.files.map(f => `<span class="file-chip">${escapeHtml(f.split('/').pop())}</span>`).join('')}
                       </div>`
                    : '';

                return `
                    <div class="release">
                        <div class="release-date">${date}</div>
                        <div class="commit-message">${escapeHtml(commit.message)}</div>
                        ${bodyHtml}
                        ${filesHtml}
                    </div>
                `;
            }).join('');

            updatesDiv.innerHTML = html;
        })
        .catch(error => {
            console.error('Error loading updates:', error);
            document.getElementById('updates').innerHTML =
                '<p style="color: red;">Error loading updates. Please try again later.</p>';
        });
</script>
</body>
</html>
