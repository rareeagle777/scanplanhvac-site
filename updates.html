<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Plan HVAC Updates</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f1ea;
            --surface: rgba(255, 255, 255, 0.92);
            --surface-border: rgba(33, 46, 58, 0.08);
            --text: #1f2a33;
            --muted: #5a6772;
            --accent: #b24a2e;
            --accent-soft: rgba(178, 74, 46, 0.12);
            --shadow: 0 24px 60px rgba(31, 42, 51, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Avenir Next", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(178, 74, 46, 0.16), transparent 30%),
                linear-gradient(180deg, #faf7f1 0%, var(--bg) 100%);
        }

        main {
            width: min(960px, calc(100% - 32px));
            margin: 0 auto;
            padding: 56px 0 72px;
        }

        .hero {
            margin-bottom: 28px;
            padding: 28px;
            border: 1px solid var(--surface-border);
            border-radius: 28px;
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .eyebrow {
            display: inline-flex;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 16px 0 12px;
            font-size: clamp(2rem, 4vw, 3.6rem);
            line-height: 0.98;
        }

        .hero p {
            max-width: 42rem;
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        #updates {
            display: grid;
            gap: 18px;
        }

        .update-card {
            padding: 24px;
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .update-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .version-chip {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 700;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 1.35rem;
        }

        ul {
            margin: 0;
            padding-left: 18px;
            color: var(--muted);
            line-height: 1.6;
        }

        .status {
            padding: 24px;
            border-radius: 24px;
            background: var(--surface);
            color: var(--muted);
            text-align: center;
            border: 1px solid var(--surface-border);
        }

        @media (max-width: 640px) {
            main {
                width: min(100% - 20px, 960px);
                padding-top: 24px;
            }

            .hero,
            .update-card,
            .status {
                padding: 20px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="hero">
            <div class="eyebrow">Product Updates</div>
            <h1>What’s New in Scan Plan HVAC</h1>
            <p>
                A customer-facing summary of recent improvements. This page intentionally shows only
                curated release information.
            </p>
        </section>

        <section id="updates" aria-live="polite">
            <div class="status">Loading updates…</div>
        </section>
    </main>

    <script>
        // Schema constraints — must match the limits enforced by the server-side generator.
        const VERSION_MAX_LEN = 20;
        const TITLE_MAX_LEN   = 80;
        const NOTE_MAX_LEN    = 200;
        const NOTES_MAX_COUNT = 5;

        // ISO-8601 date and a safe version string (digits, dots, letters, spaces, hyphens).
        const DATE_RE    = /^\d{4}-\d{2}-\d{2}$/;
        const VERSION_RE = /^[\d.a-zA-Z\s\-]+$/;

        const updatesContainer = document.getElementById("updates");

        function renderStatus(message) {
            updatesContainer.innerHTML = `<div class="status">${message}</div>`;
        }

        // Guards that every entry must pass before being rendered.
        // This is a second, independent gate — the primary sanitization happens server-side.
        function isValidUpdate(entry) {
            if (!entry || typeof entry !== "object") return false;

            const { version, date, title, notes } = entry;

            if (
                typeof version !== "string" ||
                typeof date    !== "string" ||
                typeof title   !== "string" ||
                !Array.isArray(notes)
            ) return false;

            // Format and length guards
            if (!VERSION_RE.test(version) || version.length > VERSION_MAX_LEN) return false;
            if (!DATE_RE.test(date))                                            return false;
            if (!title || title.length > TITLE_MAX_LEN)                        return false;
            if (notes.length === 0 || notes.length > NOTES_MAX_COUNT)          return false;

            return notes.every(
                (note) => typeof note === "string" && note.length > 0 && note.length <= NOTE_MAX_LEN
            );
        }

        function renderUpdates(entries) {
            const safeEntries = entries.filter(isValidUpdate);

            if (safeEntries.length === 0) {
                renderStatus("No updates are available right now.");
                return;
            }

            updatesContainer.innerHTML = "";

            safeEntries.forEach((entry) => {
                const article = document.createElement("article");
                article.className = "update-card";

                const notes = entry.notes
                    .map((note) => `<li>${escapeHTML(note)}</li>`)
                    .join("");

                article.innerHTML = `
                    <div class="update-meta">
                        <span class="version-chip">Version ${escapeHTML(entry.version)}</span>
                        <span>${escapeHTML(entry.date)}</span>
                    </div>
                    <h2>${escapeHTML(entry.title)}</h2>
                    <ul>${notes}</ul>
                `;

                updatesContainer.appendChild(article);
            });
        }

        function escapeHTML(value) {
            return value
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll("\"", "&quot;")
                .replaceAll("'", "&#39;");
        }

        async function loadUpdates() {
            try {
                const response = await fetch("./updates.json", { cache: "no-store" });
                if (!response.ok) {
                    throw new Error("Unable to load updates.");
                }

                const data = await response.json();
                if (!Array.isArray(data)) {
                    throw new Error("Invalid updates payload.");
                }

                renderUpdates(data);
            } catch (error) {
                renderStatus("Updates are temporarily unavailable.");
            }
        }

        loadUpdates();
    </script>
</body>
</html>
