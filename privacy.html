<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="3; url=https://rareeagle777.github.io/scanplanhvac-privacy/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanPlanHVAC Privacy Policy</title>
    <link rel="canonical" href="https://rareeagle777.github.io/scanplanhvac-privacy/">
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --surface: #ffffff;
            --border: rgba(15, 23, 42, 0.09);
            --text: #0f172a;
            --muted: #475569;
            --accent: #2563eb;
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "DM Sans", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 28%),
                linear-gradient(180deg, #f9fbff 0%, var(--bg) 100%);
        }

        main {
            width: min(560px, 100%);
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--surface);
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 5vw, 2.8rem);
            letter-spacing: -0.04em;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        p + p {
            margin-top: 16px;
        }

        a {
            color: var(--accent);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <h1>Redirecting to the privacy policy</h1>
        <p>
            You are being redirected to the latest ScanPlanHVAC privacy policy in a few seconds.
        </p>
        <p>
            If the redirect does not begin automatically, <a href="https://rareeagle777.github.io/scanplanhvac-privacy/">open the privacy policy here</a>.
        </p>
    </main>
</body>
</html>
