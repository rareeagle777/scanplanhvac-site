<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanPlan HVAC - Updates</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        h1 {
            color: #007AFF;
            margin-bottom: 40px;
        }
        .release {
            border-left: 4px solid #007AFF;
            padding: 20px;
            margin-bottom: 30px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .release-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .release-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
        }
        .release-tag {
            background: #007AFF;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.9em;
        }
        .release-date {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .release-notes {
            white-space: pre-wrap;
            color: #444;
        }
        .commit-message {
            font-weight: 600;
            margin-bottom: 8px;
        }
        .commit-body {
            color: #555;
            font-size: 0.95em;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .commit-files {
            margin-top: 8px;
            font-size: 0.85em;
        }
        .files-label {
            color: #888;
            margin-right: 6px;
        }
        .file-chip {
            display: inline-block;
            background: #e8f0fe;
            color: #1a56db;
            border-radius: 4px;
            padding: 2px 7px;
            margin: 2px 3px 2px 0;
            font-family: monospace;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>📱 ScanPlan HVAC Updates</h1>
    <div id="updates" class="loading">Loading updates...</div>

<script>
    const REPO_OWNER = 'rareeagle777';
    const REPO_NAME = 'Scan-Plan-HVAC';  
        
        // Fetch releases (for version updates)
        fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases`)
            .then(response => response.json())
            .then(releases => {
                const updatesDiv = document.getElementById('updates');
                
                if (releases.length === 0) {
                    // If no releases, show recent commits instead
                    return showCommits();
                }
                
                const html = releases.map(release => {
                    const date = new Date(release.published_at).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    
                    return `
                        <div class="release">
                            <div class="release-header">
                                <span class="release-title">${release.name || 'Release'}</span>
                                <span class="release-tag">${release.tag_name}</span>
                            </div>
                            <div class="release-date">${date}</div>
                            <div class="release-notes">${release.body || 'No description provided.'}</div>
                        </div>
                    `;
                }).join('');
                
                updatesDiv.innerHTML = html;
            })
            .catch(error => {
                console.error('Error fetching releases:', error);
                showCommits();
            });
        
        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function cleanBody(raw) {
            // Strip git trailers like "Co-Authored-By: ..." and trim
            return raw
                .replace(/^Co-Authored-By:.*$/gim, '')
                .trim();
        }

        function showCommits() {
            fetch('commits.json')
                .then(response => response.json())
                .then(commits => {
                    const updatesDiv = document.getElementById('updates');

                    const html = commits.slice(0, 10).map(commit => {
                        const date = new Date(commit.date).toLocaleDateString('en-US', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        });

                        const body = commit.body ? cleanBody(commit.body) : '';
                        const bodyHtml = body
                            ? `<div class="commit-body">${escapeHtml(body).replace(/\n/g, '<br>')}</div>`
                            : '';

                        const filesHtml = commit.files && commit.files.length
                            ? `<div class="commit-files">
                                 <span class="files-label">Changed files:</span>
                                 ${commit.files.map(f => `<span class="file-chip">${f.split('/').pop()}</span>`).join('')}
                               </div>`
                            : '';

                        return `
                            <div class="release">
                                <div class="release-date">${date}</div>
                                <div class="commit-message">${commit.message}</div>
                                ${bodyHtml}
                                ${filesHtml}
                            </div>
                        `;
                    }).join('');

                    updatesDiv.innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('updates').innerHTML =
                        '<p style="color: red;">Error loading updates. Please try again later.</p>';
                });
        }
    </script>
</body>
</html>
